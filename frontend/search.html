<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Local Businesses — Locafy</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Leaflet Map CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/main.css">
<style>
.search-header-sec {
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  padding: 24px 0;
}
.search-bar-wrap {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr auto;
  gap: 10px;
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 8px;
  box-shadow: var(--shadow-sm);
}
.search-input-field {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-soft);
  border-radius: 10px;
}
.search-input-field input, .search-input-field select {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 13.5px;
  color: var(--ink);
}
.search-input-field svg {
  color: var(--muted-soft);
  flex-shrink: 0;
}
.filters-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  flex-wrap: wrap;
}
.filter-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  background: #FFFFFF;
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 999px;
  user-select: none;
  transition: all 0.2s ease;
}
.filter-pill input[type="checkbox"] {
  cursor: pointer;
  accent-color: var(--blue);
}
.filter-pill:hover {
  border-color: var(--blue);
}
.filter-select {
  font-size: 12.5px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #FFFFFF;
  color: var(--ink-soft);
  outline: none;
}

/* Layout */
.search-main-layout {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 24px;
  padding: 28px 0 60px;
  align-items: start;
}
.results-col {
  min-width: 0;
}
.results-head-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.results-count {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.04em;
}
.results-cards-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}
.map-col {
  position: sticky;
  top: 90px;
  height: calc(100vh - 120px);
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-md);
  background: var(--surface);
}
#searchMap {
  width: 100%;
  height: 100%;
}
.search-pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 36px;
}

@media(max-width: 1024px) {
  .search-main-layout {
    grid-template-columns: 1fr;
  }
  .map-col {
    position: relative;
    top: 0;
    height: 380px;
    order: -1;
    margin-bottom: 20px;
  }
  .search-bar-wrap {
    grid-template-columns: 1fr;
  }
}
@media(max-width: 640px) {
  .results-cards-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<nav class="nav" id="siteNav">
  <a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="Locafy"></a>
  <div class="nav-links">
    <a href="index.html#categories">Explore</a>
    <a href="index.html#spotlight">Top picks</a>
    <a href="index.html#trending">Near you</a>
    <a href="index.html#for-biz">For business</a>
    <a href="index.html#faq">FAQ</a>
  </div>
  <div class="nav-actions">
    <a href="auth-business.html" class="btn btn-ghost">List your business</a>
    <a href="auth-user.html" class="btn btn-primary">Log in</a>
  </div>
</nav>

<!-- SEARCH FILTER BAR -->
<section class="search-header-sec">
  <div class="wrap">
    <div class="search-bar-wrap">
      <div class="search-input-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Search restaurant, salon, dentist…" aria-label="Search keyword">
      </div>
      <div class="search-input-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0116 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <input type="text" id="cityInput" placeholder="Area or City (Delhi, Noida…)" aria-label="City or area">
      </div>
      <div class="search-input-field">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        <select id="categoryFilter" aria-label="Select Category">
          <option value="">All Categories</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="executeSearch(1)" aria-label="Search">Search</button>
    </div>

    <div class="filters-strip">
      <select id="radiusFilter" class="filter-select" aria-label="Distance Radius">
        <option value="">Radius: Any distance</option>
        <option value="2">Within 2 km</option>
        <option value="5">Within 5 km</option>
        <option value="10">Within 10 km</option>
        <option value="25">Within 25 km</option>
      </select>

      <select id="sortFilter" class="filter-select" aria-label="Sort Order">
        <option value="distance">Sort: Nearest first</option>
        <option value="rating">Sort: Top rated</option>
        <option value="newest">Sort: Newly listed</option>
      </select>

      <select id="ratingFilter" class="filter-select" aria-label="Minimum Rating">
        <option value="">Rating: Any</option>
        <option value="4.5">★ 4.5 &amp; above</option>
        <option value="4.0">★ 4.0 &amp; above</option>
        <option value="3.5">★ 3.5 &amp; above</option>
      </select>

      <label class="filter-pill">
        <input type="checkbox" id="openNowFilter">
        <span>Open now</span>
      </label>

      <label class="filter-pill">
        <input type="checkbox" id="verifiedFilter">
        <span>Verified only</span>
      </label>

      <button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto;border-radius:999px;" onclick="resetFilters()">Reset</button>
    </div>
  </div>
</section>

<!-- MAIN SEARCH & MAP CONTENT -->
<main class="wrap">
  <div class="search-main-layout">
    <!-- RESULTS COLUMN -->
    <div class="results-col">
      <div class="results-head-bar">
        <span class="results-count" id="resultsCount">Loading nearby businesses…</span>
      </div>

      <div class="results-cards-grid" id="searchResults">
        <!-- Dynamic business cards inserted by search.js -->
      </div>

      <div class="search-pagination" id="searchPagination"></div>
    </div>

    <!-- MAP COLUMN -->
    <div class="map-col">
      <div id="searchMap"></div>
    </div>
  </div>
</main>

<footer class="footer">
  <span class="footer-orb"></span>
  <div class="wrap">
    <div class="footer-bottom" style="padding-top:0;">
      <p>© 2026 Locafy Technologies Pvt. Ltd. All rights reserved.</p>
      <div class="footer-social">
        <a href="#" aria-label="Twitter"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg></a>
        <a href="#" aria-label="Instagram"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/></svg></a>
      </div>
    </div>
  </div>
</footer>

<!-- Leaflet Map JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
</body>
</html>
